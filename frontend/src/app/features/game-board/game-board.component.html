<header class="game-board__topbar">
  <div class="game-board__topbar-left">
    <a routerLink="/" class="game-board__brand">Connect4</a>
    @if (game(); as g) {
      <span class="game-board__name-pill">{{ g.name }}</span>
    }
  </div>

  @if (openGames().length > 0) {
    <app-game-tab-strip
      [games]="openGames()"
      [activeGameId]="game()?.id ?? ''"
      (gameSelected)="onGameSelected($event)"
    />
  }
</header>

@if (game(); as g) {
  <div class="game-board__match">
    <app-player-badge class="game-board__player game-board__player--left" [player]="bluePlayer()" />

    <div class="game-board__center">
      <span class="game-board__turn">
        {{ g.isYourTurn ? 'Tocca a te' : 'Turno avversario' }}
      </span>
      <app-board-grid [board]="g.board" (columnClick)="onColumnClick($event)" />
    </div>

    <app-player-badge class="game-board__player game-board__player--right" [player]="redPlayer()" />
  </div>
} @else {
  <p class="game-board__loading">Caricamento partita...</p>
}
