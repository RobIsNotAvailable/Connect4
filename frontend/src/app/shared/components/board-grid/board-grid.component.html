<div class="board">
  @for (colIndex of columnIndices; track colIndex) {
    <button
      class="board__column"
      type="button"
      [attr.aria-label]="'Colonna ' + (colIndex + 1)"
      (click)="columnClick.emit(colIndex)"
    >
      @for (rowIndex of rowIndices; track rowIndex) {
        <app-disc
          [color]="board()[rowIndex][colIndex] ?? 'neutral'"
          variant="piece"
          size="lg"
        />
      }
    </button>
  }
</div>
