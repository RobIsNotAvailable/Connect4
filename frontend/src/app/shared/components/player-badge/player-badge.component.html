@if (player(); as p) {
  <div class="player-badge" [class]="'player-badge--' + p.color">
    <svg
      class="player-badge__icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    </svg>
    <span class="player-badge__name">{{ p.username }}</span>
  </div>
}
