services:
  # The game server, reachable from the host too on port 8080.
  server:
    build: ./server
    ports:
      - "8080:8080"

  # The clients, each with its own window on the screen of the host (its X
  # server). How many: CLIENTS=4 docker compose up, or docker compose up
  # --scale clients=4 (2 if not said).
  clients:
    build: ./client
    depends_on:
      - server
    deploy:
      replicas: ${CLIENTS:-2}
    # X11_SOCKET: where the X socket is for the Docker daemon, when it is not
    # /tmp/.X11-unix (Windows PowerShell, see the README).
    environment:
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      - ${X11_SOCKET:-/tmp/.X11-unix}:/tmp/.X11-unix
